name: Smoke test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test (${{ matrix.os }}, Java ${{ matrix.java }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The lowest Java version that jdtls runs on, which is also the latest LTS version, and the latest version.
        java: ['25', '27']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # The language server is started with the JDK in JAVA_HOME.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      # On macOS, Sublime Text takes its environment from the login shell, where the runner sets JAVA_HOME to its
      # default Java, so set it there too.
      - name: Pass JAVA_HOME to Sublime Text
        if: runner.os == 'macOS'
        run: echo "export JAVA_HOME='$JAVA_HOME'" | tee -a ~/.bashrc ~/.zshrc

      - uses: sublimelsp/lsp_smoke_test@v1

  # A single check whose name doesn't depend on the os matrix, for rulesets to require. It runs even when the workflow
  # is cancelled: a skipped job counts as passing for a required check.
  result:
    name: Smoke test result
    needs: smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check smoke test result
        env:
          RESULT: ${{ needs.smoke.result }}
        run: |
          echo "Smoke test result: $RESULT"
          test "$RESULT" = success
